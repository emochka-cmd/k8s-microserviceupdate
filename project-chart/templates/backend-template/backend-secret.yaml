{{- if .Values.backend.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
    name: {{ .Values.backend.secrets.name }}
    namespace: {{ .Values.namespace.name }}
    labels:
        app: backend
type: Opaque
stringData:
    WEATHER_API_KEY: {{ required "backend.secrets.weatherApiKey is required when secrets.create=true" .Values.backend.secrets.weatherApiKey | quote }}
    REDIS_PASSWORD: {{ .Values.backend.secrets.redisPassword | default "" | quote }}
{{- end }}
