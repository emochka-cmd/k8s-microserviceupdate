apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend-deployment
    namespace: {{ .Values.namespace.name }}
    labels:
        app: frontend

spec:
    {{- if not .Values.frontend.hpa.enabled }}
    replicas: {{ .Values.frontend.replicaCount }}
    {{- end }}
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
              - name: weather-frontend
                image: {{ printf "%s:%s" .Values.frontend.containerName .Values.frontend.containerVersion }}
                imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
                ports:
                    - name: http
                      containerPort: {{ .Values.frontend.config.listenPort }}
                volumeMounts:
                    - name: nginx-config
                      mountPath: /etc/nginx/conf.d/default.conf
                      subPath: default.conf
                livenessProbe:
                    httpGet:
                        path: /
                        port: http
                    initialDelaySeconds: 5
                    periodSeconds: 10
                readinessProbe:
                    httpGet:
                        path: /
                        port: http
                    initialDelaySeconds: 3
                    periodSeconds: 5
                resources:
                    requests:
                        cpu: {{ .Values.frontend.resources.requests.cpu | quote }}
                        memory: {{ .Values.frontend.resources.requests.memory | quote }}
                    limits:
                        cpu: {{ .Values.frontend.resources.limits.cpu | quote }}
                        memory: {{ .Values.frontend.resources.limits.memory | quote }}
            volumes:
              - name: nginx-config
                configMap:
                    name: frontend-config
