apiVersion: v1
kind: Service
metadata:
    name: frontend
    namespace: {{ .Values.namespace.name }}
    labels:
        app: frontend
spec:
    selector:
        app: frontend
    ports:
      - name: http
        port: {{ .Values.frontend.service.port }}
        targetPort: http
        protocol: TCP
    type: {{ .Values.frontend.service.type }}
